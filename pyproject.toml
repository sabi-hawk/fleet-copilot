[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-copilot"
version = "1.0.0"
description = "Agentic AI Fleet Copilot: grounded Q&A, insights and human-approved actions over device telemetry (LangGraph)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "anthropic>=2.11,<3",
    "google-genai>=3.6,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
