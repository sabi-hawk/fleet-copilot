# Action proposals, policy gate and human approval.
# proposals_allowed: an action for this target must reach the approval stage (policy passed).
# proposals_blocked: no action for this target may reach approval (policy rejection OR the agent declining).
# approval: how the eval's simulated administrator answers the interrupt.

- id: act-ticket-failing-check-approved
  category: actions
  tenant: acme-001
  question: Open a remediation ticket for the failing screen_lock check on MT7PJB7N5LRE.
  approval: {decision: approve_all, approver: alice@acme}
  expect:
    proposals_allowed: [{tool: open_remediation_ticket, device_id: MT7PJB7N5LRE}]
    approval_requested: true
    executed_count: 1

- id: act-ticket-passing-check-blocked
  category: actions
  tenant: acme-001
  question: Open a remediation ticket for screen_lock on 9MXJVZ1I0DKA.
  approval: {decision: approve_all}
  expect:
    proposals_blocked: [{tool: open_remediation_ticket, device_id: 9MXJVZ1I0DKA}]   # screen_lock passes on all its snapshots
    approval_requested: false
    executed_count: 0

