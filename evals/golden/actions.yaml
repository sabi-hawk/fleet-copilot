# Follow-up reference resolution needs conversational reasoning: LLM reasoners only.
- id: act-multiturn-notify-low-disk-owners
  category: actions
  tenant: acme-001
  reasoners: [claude, gemini]
  turns:
    - question: Which devices are low on disk space?
    - question: Notify the employees who use those devices to free up space.
      approval: {decision: approve_all, approver: alice@acme}
  expect:
    proposals_allowed:
      - {tool: notify_employee, employee_id: emp-acme-1005}
      - {tool: notify_employee, employee_id: emp-acme-1003}
    executed_count: 2
