# Grounded question answering. Gold answers were derived directly from the raw NDJSON
# (latest snapshot per device, 2026-06-12), independently of the copilot's tools.
# devices_exact = the set of tenant device IDs the answer must mention (no more, no less).

- id: qa-low-disk-acme
  category: grounded_qa
  tenant: acme-001
  question: Which devices at Acme are low on disk space?
  expect:
    devices_exact: [8NM23J95R5I6, MT7PJB7N5LRE]      # 2.6% and 2.0% free; all others >= 22%
    tools_any: [find_devices, detect_storage_pressure, get_fleet_overview]
    tools_exclude: [create_upgrade_order, open_remediation_ticket, flag_device_for_replacement, notify_employee]

- id: qa-low-disk-globex
  category: grounded_qa
  tenant: globex-002
  question: Which devices are low on disk space?
  expect:
    devices_exact: [E4V0SB5I0MYU, JRZSGXVMKE6M]      # 2.4% and 2.0% free
    tools_any: [find_devices, detect_storage_pressure]

- id: qa-low-disk-initech
  category: grounded_qa
  tenant: initech-003
  question: Which devices are running low on storage?
  expect:
    devices_exact: [DARFCP0BQM2G, RLD7WV7J82SH]      # 2.0% and 2.0% free
    tools_any: [find_devices, detect_storage_pressure]

# disk_encryption is the only high-severity check and it passes on every snapshot of every device:
# the correct answer is "none" - padding the answer with devices is a grounding failure.
- id: qa-high-sev-laptops-acme
  category: grounded_qa
  tenant: acme-001
  question: Show me laptops failing high-severity compliance checks.
  expect:
    devices_exact: []
    must_contain_any: ["none", "no laptop", "0 of", "zero", "not failing", "no high-severity"]
    tools_any: [get_compliance_status, find_devices]

