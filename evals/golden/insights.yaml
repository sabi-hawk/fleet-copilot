# Insight & trend detection over the 30-day window. devices_include = must be found (recall);
# devices_exclude = must NOT be reported (precision). Gold sets from the raw time series:
# - battery EOL: condition 'Service Recommended' + steady full_charge_capacity fade (-4.2%) on 3 Acme devices only
# - RAM: >=85% used in 30/30 (M4XVHUV1MEPZ, I3JLKILKQTAC) and 23/30 (JRZSGXVMKE6M); CUXW0BQSV1B7 13/30 is intermittent
# - storage: six devices declining linearly to ~2% free
# - drift: screen_lock pass->fail on 10 devices; os_up_to_date fails all window on 19 devices

- id: ins-battery-acme
  category: insights
  tenant: acme-001
  question: Which batteries are approaching end-of-life?
  expect:
    devices_include: [7VP16KHV88LM, 8NM23J95R5I6, M4XVHUV1MEPZ]
    devices_exclude: [1LYSSFD074BB, 9MXJVZ1I0DKA, DSYPSES7SKBB, MT7PJB7N5LRE, Q3VUITEGQ400, XSU9UUDGU6AC, DLT35MHGTH2D]
    tools_any: [detect_battery_health, run_fleet_health_scan]

- id: ins-battery-globex
  category: insights
  tenant: globex-002
  question: Are any batteries approaching end-of-life?
  expect:
    devices_exact: []
    must_contain_any: ["no ", "none", "0 "]
    tools_any: [detect_battery_health, run_fleet_health_scan]

